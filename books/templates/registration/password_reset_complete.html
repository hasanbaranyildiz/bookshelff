{% extends "books/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-lg" style="background-color: var(--card-bg); border-radius: 16px;">
            <div class="card-body p-5 text-center">
                <i class="fas fa-circle-check fa-3x text-success mb-3"></i>
                <h2 class="fw-bold">Şifren Başarıyla Değiştirildi! 🎉</h2>
                <p class="text-white-50 mt-3">
                    Artık yeni şifrenle giriş yapabilirsin.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary mt-3 px-5 py-3 fw-bold" style="border-radius: 12px;">
                    <i class="fas fa-sign-in-alt me-2"></i>Giriş Yap
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
