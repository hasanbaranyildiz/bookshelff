{% extends 'books/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card bg-dark border-secondary shadow-lg" style="border-radius: 20px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="display-6 mb-2 text-primary"><i class="fas fa-lock"></i></div>
                    <h2 class="fw-bold text-white">Giriş Yap</h2>
                    <p class="text-muted small">Kütüphanenize erişmek için giriş yapın.</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    {% if form.errors %}
                        <div class="alert alert-danger border-0 small py-2 mb-4" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>Kullanıcı adı veya şifre hatalı.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label text-secondary small text-uppercase">Kullanıcı Adı</label>
                        <input type="text" name="username" class="form-control bg-dark border-secondary text-white py-2 px-3" required style="border-radius: 10px;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small text-uppercase">Şifre</label>
                        <input type="password" name="password" class="form-control bg-dark border-secondary text-white py-2 px-3" required style="border-radius: 10px;">
                    </div>

                    <div class="d-grid gap-2 mb-4">
                        <button type="submit" class="btn btn-primary py-2 fw-bold">Giriş Yap</button>
                    </div>

                    <div class="text-center">
                        <p class="text-muted small mb-0">Hesabınız yok mu? <a href="{% url 'signup' %}" class="text-primary text-decoration-none fw-bold">Kayıt Ol</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .form-control:focus {
        background-color: #1e293b !important;
        border-color: var(--primary-color) !important;
        box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1) !important;
    }
</style>
{% endblock %}
