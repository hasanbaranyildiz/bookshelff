{% extends "books/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-lg" style="background-color: var(--card-bg); border-radius: 16px;">
            <div class="card-body p-5 text-center">
                <i class="fas fa-envelope-circle-check fa-3x text-success mb-3"></i>
                <h2 class="fw-bold">E-posta Gönderildi!</h2>
                <p class="text-white-50 mt-3">
                    Eğer girdiğin e-posta adresiyle kayıtlı bir hesap bulunuyorsa, 
                    şifre sıfırlama linki içeren bir e-posta gönderdik.
                </p>
                <p class="text-white-50">
                    Birkaç dakika içinde gelmediyse spam/gereksiz klasörünü de kontrol et.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary mt-3 px-4 py-2" style="border-radius: 12px;">
                    <i class="fas fa-arrow-left me-2"></i>Giriş Sayfasına Dön
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
