{% extends "books/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-lg" style="background-color: var(--card-bg); border-radius: 16px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-key fa-3x text-warning mb-3"></i>
                    <h2 class="fw-bold">Şifremi Unuttum</h2>
                    <p class="text-white-50">Kayıtlı e-posta adresini gir, sana şifre sıfırlama linki gönderelim.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="id_email" class="form-label fw-semibold">E-posta Adresi</label>
                        <input type="email" name="email" id="id_email" class="form-control form-control-lg" 
                               placeholder="ornek@gmail.com" required
                               style="background-color: #1a1a2e; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 12px;">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold" style="border-radius: 12px;">
                        <i class="fas fa-paper-plane me-2"></i>Sıfırlama Linki Gönder
                    </button>
                </form>
                <div class="text-center mt-4">
                    <a href="{% url 'login' %}" class="text-decoration-none" style="color: var(--primary-color);">
                        <i class="fas fa-arrow-left me-1"></i>Giriş sayfasına dön
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
